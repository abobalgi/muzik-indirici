name: 🎵 Flux Music – Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build → APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Kaynak Kod ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Bağımlılıklar ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. EAS CLI ─────────────────────────────────────────────
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 5. Build ───────────────────────────────────────────────
      - name: Build APK
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── 6. APK'yı İndir ────────────────────────────────────────
      - name: Download built APK
        run: |
          BUILD_URL=$(eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['artifacts']['buildUrl'])")
          echo "APK URL: $BUILD_URL"
          curl -L "$BUILD_URL" -o FluxMusic.apk

      # ── 7. Artifact Olarak Yükle ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxMusic-${{ github.run_number }}-APK
          path: FluxMusic.apk
          retention-days: 30

      # ── 8. Özet ────────────────────────────────────────────────
      - name: Build summary
        run: |
          SIZE=$(du -sh FluxMusic.apk | cut -f1)
          echo "## ✅ Build Tamamlandı" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Boyutu:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Build #:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          
