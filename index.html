<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Music | Trend Müzik Dünyası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: #121216; --border: #27272a; --primary: #fbbf24; --accent: #f43f5e; --blue: #0ea5e9; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 160px; }
        .hero { padding: 40px 20px 20px; text-align: center; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px; }
        .hero h1 span { color: var(--accent); }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .search-container { position: relative; z-index: 1000; }
        .search-box { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 6px 6px 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; }
        .search-box button { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 5px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; }
        .sug-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .section-title { margin: 25px 0 15px; font-size: 1.1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }
        .loader { display: none; flex-direction: column; align-items: center; margin: 50px 0; gap: 15px; }
        .flux-spinner { width: 45px; height: 45px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p { color: var(--muted); font-size: 0.85rem; letter-spacing: 1px; }
        .results { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--border); transition: 0.2s; }
        .card.playing { border-color: var(--accent); background: rgba(244, 63, 94, 0.05); }
        .card img { width: 68px; height: 68px; border-radius: 10px; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .info h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info p { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .info p i { color: var(--primary); }
        
        /* Butonları 3'lü yapıya uygun hale getirdik */
        .actions { display: flex; flex-direction: column; gap: 5px; }
        .btn { border: none; padding: 0 8px; height: 26px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; cursor: pointer; width: 85px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-play { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .btn-mp3 { background: rgba(244, 63, 94, 0.2); color: var(--accent); }
        .btn-mp4 { background: rgba(14, 165, 233, 0.2); color: var(--blue); }

        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0c0c0e; border-top: 2px solid var(--accent); padding: 12px 20px; display: none; flex-direction: column; gap: 10px; z-index: 2000; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .p-top { display: flex; align-items: center; gap: 12px; }
        .p-top img { width: 45px; height: 45px; border-radius: 6px; }
        .p-meta { flex: 1; min-width: 0; }
        .p-meta h4 { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-meta p { font-size: 0.7rem; color: var(--accent); }
        .p-progress { width: 100%; display: flex; align-items: center; gap: 10px; }
        .p-progress span { font-size: 0.65rem; color: var(--muted); min-width: 35px; }
        .p-seek { flex: 1; height: 5px; appearance: none; background: #27272a; border-radius: 10px; outline: none; cursor: pointer; }
        .p-seek::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; border: 2px solid #fff; }
        .p-controls { display: flex; justify-content: center; gap: 35px; align-items: center; }
        .p-btn { background: transparent; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero"><h1>Flux<span>Music</span></h1></div>
    <div class="container">
        <div class="search-container">
            <div class="search-box"><input type="text" id="searchInput" autocomplete="off" placeholder="Sanatçı, şarkı veya link..."><button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button></div>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
        
        <h2 id="listTitle" class="section-title"></h2>
        <div class="loader" id="loader"><div class="flux-spinner"></div><p>FLUX EVRENİ TARANIYOR...</p></div>
        <div id="results" class="results"></div>
    </div>

    <div class="player-bar" id="playerBar">
        <div class="p-top"><img id="pImg" src=""><div class="p-meta"><h4 id="pTitle">Seçilmedi</h4><p>Flux Player</p></div><button onclick="closePlayer()" style="background:none; border:none; color:#555;"><i class="fa-solid fa-chevron-down"></i></button></div>
        <div class="p-progress"><span id="pCurrent">0:00</span><input type="range" class="p-seek" id="pSeekBar" value="0" step="1"><span id="pDuration">0:00</span></div>
        <div class="p-controls">
            <button class="p-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="p-btn" style="font-size:2.2rem;color:var(--accent)" onclick="togglePlay()" id="pMainBtn"><i class="fa-solid fa-circle-play"></i></button>
            <button class="p-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <audio id="audio" style="display:none;"></audio>

    <script>
        const API_BASE = "/api";
        const audio = document.getElementById('audio');
        const pSeekBar = document.getElementById('pSeekBar');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        
        let currentPlaylist = [];
        let currentIndex = -1;
        let history = JSON.parse(localStorage.getItem('fHist')) || [];

        window.onload = () => { triggerSearch(true); };

        searchInput.oninput = (e) => { if(e.target.value) fetchSug(e.target.value); else showHist(); };
        searchInput.onfocus = () => { if(!searchInput.value) showHist(); };
        document.onclick = (e) => { if(!e.target.closest('.search-container')) suggestionsBox.style.display='none'; };

        function fetchSug(q) {
            const s = document.createElement('script');
            s.src = `https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(q)}&jsonp=handleSug`;
            document.head.appendChild(s);
        }
        window.handleSug = (data) => {
            const sug = data[1];
            suggestionsBox.innerHTML = sug.slice(0,5).map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = sug.length ? 'block' : 'none';
        };
        function showHist() {
            if(!history.length) return;
            suggestionsBox.innerHTML = history.map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue)"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = 'block';
        }
        function selSug(t) { searchInput.value=t; suggestionsBox.style.display='none'; triggerSearch(); }

        async function triggerSearch(isTrend = false) {
            const q = isTrend ? "" : searchInput.value.trim();
            if(!isTrend && !q) return;

            if(!isTrend) {
                history = [q, ...history.filter(i => i!==q)].slice(0,5);
                localStorage.setItem('fHist', JSON.stringify(history));
                suggestionsBox.style.display='none';
            }

            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            const listTitle = document.getElementById('listTitle');

            resDiv.innerHTML = ""; loader.style.display = 'flex';
            listTitle.innerHTML = isTrend ? '<i class="fa-solid fa-fire"></i> Popüler Şarkılar' : '<i class="fa-solid fa-magnifying-glass" style="color:var(--blue)"></i> Arama Sonuçları';

            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                
                if(data.length === 0) throw new Error("Boş Liste");
                
                currentPlaylist = data;
                data.forEach((item, index) => {
                    resDiv.innerHTML += `
                        <div class="card" id="card-${index}">
                            <img src="${item.thumbnail}">
                            <div class="info"><h3>${item.title}</h3><p><i class="fa-solid fa-clock"></i> ${item.duration}</p></div>
                            <div class="actions">
                                <button class="btn btn-play" onclick="playSong(${index})"><i class="fa-solid fa-play"></i> Dinle</button>
                                <button class="btn btn-mp3" onclick="dl('${item.id}', 'audio')"><i class="fa-solid fa-download"></i> MP3</button>
                                <button class="btn btn-mp4" onclick="dl('${item.id}', 'video')"><i class="fa-solid fa-video"></i> MP4</button>
                            </div>
                        </div>`;
                });
            } catch(e) { resDiv.innerHTML = "<p style='text-align:center; color:var(--muted);'>Filtrelere uygun sonuç bulunamadı.</p>"; }
            finally { loader.style.display = 'none'; }
        }

        async function playSong(index) {
            if(index < 0 || index >= currentPlaylist.length) return;
            currentIndex = index;
            const item = currentPlaylist[index];

            document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${index}`);
            if(activeCard) activeCard.classList.add('playing');

            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('pTitle').innerText = item.title;
            document.getElementById('pImg').src = item.thumbnail;
            
            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            audio.src = `${API_BASE}/stream_audio?id=${item.id}`;
            audio.play();
            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
        }

        function nextSong() { if(currentIndex < currentPlaylist.length - 1) playSong(currentIndex + 1); }
        function prevSong() { if(currentIndex > 0) playSong(currentIndex - 1); }
        function togglePlay() { 
            if(audio.paused) { audio.play(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; }
            else { audio.pause(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; }
        }

        audio.ontimeupdate = () => {
            if(!isNaN(audio.duration)) {
                pSeekBar.max = audio.duration;
                pSeekBar.value = audio.currentTime;
                document.getElementById('pCurrent').innerText = fmt(audio.currentTime);
                document.getElementById('pDuration').innerText = fmt(audio.duration);
            }
        };

        pSeekBar.oninput = () => { audio.currentTime = pSeekBar.value; };
        audio.onended = () => { nextSong(); };

        function fmt(s) { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }
        function dl(id, type) { window.location.href = `${API_BASE}/download?id=${encodeURIComponent(id)}&type=${type}`; }
        function closePlayer() { document.getElementById('playerBar').style.display='none'; audio.pause(); }
        searchInput.onkeydown = (e) => { if(e.key==='Enter') triggerSearch(); };
    </script>
</body>
</html>
