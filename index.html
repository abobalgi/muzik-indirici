<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Music | Ultra Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.6); --border: rgba(255,255,255,0.08); --primary: #fbbf24; --accent: #f43f5e; --blue: #0ea5e9; --text: #f8fafc; --muted: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 180px; background-image: radial-gradient(circle at 50% 0%, rgba(244,63,94,0.1) 0%, rgba(9,9,11,1) 50%); background-attachment: fixed; }
        
        .header { padding: 40px 20px 20px; text-align: center; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .header h1 span { background: linear-gradient(135deg, var(--accent), #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 650px; margin: 0 auto; padding: 0 15px; }
        .search-wrapper { position: relative; z-index: 100; margin-bottom: 30px; }
        .search-box { display: flex; background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .search-box:focus-within { border-color: rgba(244,63,94,0.4); box-shadow: 0 10px 40px rgba(244,63,94,0.15); }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.05rem; padding-left: 15px; outline: none; }
        .search-box button { background: linear-gradient(135deg, var(--accent), #e11d48); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s; }
        .search-box button:active { transform: scale(0.92); }
        
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 16px; margin-top: 8px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.7); overflow: hidden; }
        .sug-item { padding: 14px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--muted); transition: 0.2s; }
        .sug-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .section-header { font-size: 1.2rem; font-weight: 700; margin: 0 0 15px 5px; display: flex; align-items: center; gap: 10px; }
        
        /* PREMIUM LİSTE TASARIMI */
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 15px; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .track-card:hover { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); }
        .track-card.playing { border-color: var(--accent); background: rgba(244, 63, 94, 0.05); }
        
        .track-thumb { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .track-thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .track-card:hover .track-thumb img { transform: scale(1.05); }
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; }
        .track-thumb:hover .play-overlay { opacity: 1; }
        .play-overlay i { color: #fff; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .track-info { flex: 1; min-width: 0; padding-right: 10px; }
        .track-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .track-info p { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .track-info p i { color: var(--primary); font-size: 0.75rem; }
        
        .track-actions { display: flex; gap: 8px; }
        .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); }
        .btn-mp3 { background: rgba(244, 63, 94, 0.1); color: var(--accent); }
        .btn-mp3:hover { background: var(--accent); color: #fff; }
        .btn-mp4 { background: rgba(14, 165, 233, 0.1); color: var(--blue); }
        .btn-mp4:hover { background: var(--blue); color: #fff; }

        /* YÜKLEME ANİMASYONU */
        .loader { display: none; flex-direction: column; align-items: center; padding: 40px 0; }
        .loader-ring { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* SPOTIFY TARZI PLAYER */
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; display: none; flex-direction: column; gap: 12px; z-index: 2000; }
        .p-top { display: flex; align-items: center; gap: 15px; position: relative; z-index: 2; }
        .p-top img { width: 50px; height: 50px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .p-meta { flex: 1; min-width: 0; }
        .p-meta h4 { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-meta p { font-size: 0.75rem; color: var(--accent); font-weight: 500; }
        
        .p-progress { width: 100%; display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
        .p-progress span { font-size: 0.7rem; color: var(--muted); min-width: 35px; font-variant-numeric: tabular-nums; }
        .p-seek { flex: 1; height: 4px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 10px; outline: none; cursor: pointer; }
        .p-seek::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: 0.2s; }
        .p-seek::-webkit-slider-thumb:hover { transform: scale(1.3); }
        
        .p-controls { display: flex; justify-content: center; gap: 30px; align-items: center; position: relative; z-index: 2; }
        .ctrl-icon { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .ctrl-icon:hover { opacity: 1; transform: scale(1.1); }
        .ctrl-play { font-size: 2.5rem; color: var(--accent); opacity: 1; }
        
        #visualizer { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; z-index: 0; opacity: 0.3; pointer-events: none; }

        /* SÖZLER MODALI */
        .lyrics-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 3000; display: none; flex-direction: column; padding: 40px 20px; }
        .l-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .l-header h2 { font-size: 1.5rem; color: #fff; }
        .l-close { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.2rem; cursor: pointer; }
        .l-content { flex: 1; overflow-y: auto; text-align: center; font-size: 1.1rem; line-height: 2; color: rgba(255,255,255,0.8); white-space: pre-wrap; padding-bottom: 50px; }
    </style>
</head>
<body>
    <div class="header"><h1>Flux<span>Music</span></h1></div>
    <div class="container">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" autocomplete="off" placeholder="Ne dinlemek istersin?">
                <button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="suggestionsBox" class="suggestions"></div>
        </div>
        
        <div id="listTitle" class="section-header"></div>
        <div class="loader" id="loader"><div class="loader-ring"></div><span style="color:var(--muted); font-size:0.9rem;">Evren taranıyor...</span></div>
        <div id="results" class="track-list"></div>
    </div>

    <div class="lyrics-modal" id="lyricsModal">
        <div class="l-header">
            <h2><i class="fa-solid fa-microphone-lines" style="color:var(--accent)"></i> Şarkı Sözleri</h2>
            <button class="l-close" onclick="toggleLyrics()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="l-content" id="lyricsContent">Yükleniyor...</div>
    </div>

    <div class="player-bar" id="playerBar">
        <canvas id="visualizer"></canvas>
        <div class="p-top">
            <img id="pImg" src="">
            <div class="p-meta"><h4 id="pTitle">Seçilmedi</h4><p>Flux Quality</p></div>
            <button class="ctrl-icon" onclick="toggleLyrics()"><i class="fa-solid fa-quote-right"></i></button>
            <button class="ctrl-icon" onclick="closePlayer()"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
        <div class="p-progress"><span id="pCurrent">0:00</span><input type="range" class="p-seek" id="pSeekBar" value="0" step="1"><span id="pDuration">0:00</span></div>
        <div class="p-controls">
            <button class="ctrl-icon" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="ctrl-icon ctrl-play" onclick="togglePlay()" id="pMainBtn"><i class="fa-solid fa-circle-play"></i></button>
            <button class="ctrl-icon" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <audio id="audio" style="display:none;" crossorigin="anonymous"></audio>

    <script>
        const API_BASE = "/api";
        const audio = document.getElementById('audio');
        const pSeekBar = document.getElementById('pSeekBar');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        
        let currentPlaylist = [];
        let currentIndex = -1;
        let history = JSON.parse(localStorage.getItem('fHist')) || [];
        let audioCtx, analyser, source;

        window.onload = () => { triggerSearch(true); };

        searchInput.oninput = (e) => { if(e.target.value) fetchSug(e.target.value); else showHist(); };
        searchInput.onfocus = () => { if(!searchInput.value) showHist(); };
        document.onclick = (e) => { if(!e.target.closest('.search-wrapper')) suggestionsBox.style.display='none'; };

        function fetchSug(q) {
            const s = document.createElement('script');
            s.src = `https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(q)}&jsonp=handleSug`;
            document.head.appendChild(s);
        }
        window.handleSug = (data) => {
            const sug = data[1];
            suggestionsBox.innerHTML = sug.slice(0,6).map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-magnifying-glass"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = sug.length ? 'block' : 'none';
        };
        function showHist() {
            if(!history.length) return;
            suggestionsBox.innerHTML = history.map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue)"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = 'block';
        }
        function selSug(t) { searchInput.value=t; suggestionsBox.style.display='none'; triggerSearch(); }

        async function triggerSearch(isTrend = false) {
            const q = isTrend ? "" : searchInput.value.trim();
            if(!isTrend && !q) return;

            if(!isTrend) {
                history = [q, ...history.filter(i => i!==q)].slice(0,6);
                localStorage.setItem('fHist', JSON.stringify(history));
                suggestionsBox.style.display='none';
            }

            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            const listTitle = document.getElementById('listTitle');

            resDiv.innerHTML = ""; loader.style.display = 'flex';
            listTitle.innerHTML = isTrend ? '<i class="fa-solid fa-bolt" style="color:var(--primary)"></i> <span>Trend Listesi (40 Şarkı)</span>' : `<i class="fa-solid fa-magnifying-glass" style="color:var(--blue)"></i> <span>'${q}' için sonuçlar</span>`;

            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if(data.length === 0) throw new Error("Boş Liste");
                
                currentPlaylist = data;
                data.forEach((item, index) => {
                    resDiv.innerHTML += `
                        <div class="track-card" id="card-${index}">
                            <div class="track-thumb" onclick="playSong(${index})">
                                <img src="${item.thumbnail}" loading="lazy">
                                <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                            </div>
                            <div class="track-info">
                                <h3>${item.title}</h3>
                                <p><i class="fa-regular fa-clock"></i> ${item.duration}</p>
                            </div>
                            <div class="track-actions">
                                <button class="icon-btn btn-mp3" onclick="dl('${item.id}', 'audio')" title="MP3 İndir"><i class="fa-solid fa-download"></i></button>
                                <button class="icon-btn btn-mp4" onclick="dl('${item.id}', 'video')" title="Klip İndir"><i class="fa-solid fa-video"></i></button>
                            </div>
                        </div>`;
                });
            } catch(e) { resDiv.innerHTML = "<div style='text-align:center; color:var(--muted); padding:20px;'>Sonuç bulunamadı.</div>"; }
            finally { loader.style.display = 'none'; }
        }

        async function playSong(index) {
            if(index < 0 || index >= currentPlaylist.length) return;
            currentIndex = index;
            const item = currentPlaylist[index];

            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${index}`);
            if(activeCard) activeCard.classList.add('playing');

            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('pTitle').innerText = item.title;
            document.getElementById('pImg').src = item.thumbnail;
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: item.title, artist: 'Flux Music',
                    artwork: [{ src: item.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }

            if(!audioCtx) setupVisualizer();
            if(document.getElementById('lyricsModal').style.display === 'flex') fetchLyrics(item.title);

            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            audio.src = `${API_BASE}/stream_audio?id=${item.id}`;
            audio.play();
            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
        }

        async function fetchLyrics(title) {
            const content = document.getElementById('lyricsContent');
            content.innerHTML = "<i class='fa-solid fa-spinner fa-spin' style='font-size:2rem; color:var(--accent); margin-top:20px;'></i><br><br>Sözler aranıyor...";
            try {
                const res = await fetch(`${API_BASE}/lyrics?q=${encodeURIComponent(title)}`);
                const data = await res.json();
                if(data.lyrics) content.innerText = data.lyrics;
                else content.innerHTML = "<i class='fa-solid fa-heart-crack' style='font-size:2rem; color:var(--muted);'></i><br><br>Bu şarkının sözleri henüz veri tabanında yok.";
            } catch(e) { content.innerText = "Sözlere ulaşılamadı."; }
        }
        function toggleLyrics() {
            const modal = document.getElementById('lyricsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            if(modal.style.display === 'flex' && currentIndex >= 0) fetchLyrics(currentPlaylist[currentIndex].title);
        }

        function setupVisualizer() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser); analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 1.5;
                let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;
                    ctx.fillStyle = `rgba(244, 63, 94, ${barHeight/50})`; 
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 2;
                }
            }
            draw();
        }

        function nextSong() { if(currentIndex < currentPlaylist.length - 1) playSong(currentIndex + 1); }
        function prevSong() { if(currentIndex > 0) playSong(currentIndex - 1); }
        function togglePlay() { 
            if(audio.paused) { audio.play(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; }
            else { audio.pause(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; }
        }

        audio.ontimeupdate = () => {
            if(!isNaN(audio.duration)) {
                pSeekBar.max = audio.duration; pSeekBar.value = audio.currentTime;
                document.getElementById('pCurrent').innerText = fmt(audio.currentTime); document.getElementById('pDuration').innerText = fmt(audio.duration);
            }
        };
        pSeekBar.oninput = () => { audio.currentTime = pSeekBar.value; };
                audio.onended = () => { nextSong(); };

        function fmt(s) { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }
        function dl(id, type) { window.location.href = `${API_BASE}/download?id=${encodeURIComponent(id)}&type=${type}`; }
        function closePlayer() { document.getElementById('playerBar').style.display='none'; document.getElementById('lyricsModal').style.display='none'; audio.pause(); }
        searchInput.onkeydown = (e) => { if(e.key==='Enter') triggerSearch(); };
    </script>
</body>
</html>
