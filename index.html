<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Music | Premium Dinle & İndir</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: #121216; --border: #27272a; --primary: #fbbf24; --accent: #f43f5e; --blue: #0ea5e9; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 160px; }
        .hero { padding: 40px 20px; text-align: center; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; }
        .hero h1 span { color: var(--accent); }
        .hero p { color: var(--muted); font-size: 0.85rem; margin-top: 5px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .search-container { position: relative; z-index: 1000; }
        .search-box { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 6px 6px 18px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; outline: none; }
        .search-box button { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 5px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; }
        .sug-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .sug-item:hover { background: rgba(255,255,255,0.05); }
        .results { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--border); }
        .card img { width: 68px; height: 68px; border-radius: 10px; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .info h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info p { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .info p i { color: var(--primary); }
        .actions { display: flex; flex-direction: column; gap: 5px; }
        .btn { border: none; padding: 0 10px; height: 28px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; width: 85px; }
        .btn-play { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .btn-mp3 { background: rgba(244, 63, 94, 0.2); color: var(--accent); }
        .btn-mp4 { background: rgba(14, 165, 233, 0.2); color: var(--blue); }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0c0c0e; border-top: 2px solid var(--accent); padding: 12px 20px; display: none; flex-direction: column; gap: 8px; z-index: 2000; }
        .p-top { display: flex; align-items: center; gap: 12px; }
        .p-top img { width: 42px; height: 42px; border-radius: 6px; }
        .p-meta { flex: 1; min-width: 0; }
        .p-meta h4 { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-meta p { font-size: 0.7rem; color: var(--accent); }
        .p-progress { width: 100%; display: flex; align-items: center; gap: 10px; }
        .p-progress span { font-size: 0.65rem; color: var(--muted); min-width: 32px; }
        .p-seek { flex: 1; height: 4px; appearance: none; background: #27272a; border-radius: 10px; outline: none; }
        .p-seek::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; }
        .p-controls { display: flex; justify-content: center; gap: 30px; align-items: center; }
        .p-btn { background: transparent; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero"><h1>Flux<span>Music</span></h1><p>Premium müzik ve klip evreni.</p></div>
    <div class="container">
        <div class="search-container">
            <div class="search-box"><input type="text" id="searchInput" autocomplete="off" placeholder="Şarkı adı..."><button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button></div>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
        <div id="results" class="results"></div>
    </div>
    <div class="player-bar" id="playerBar">
        <div class="p-top"><img id="pImg" src=""><div class="p-meta"><h4 id="pTitle">Seçilmedi</h4><p><i class="fa-solid fa-bolt"></i> Flux Oynatıcı</p></div><button onclick="closePlayer()" style="background:none; border:none; color:#555;"><i class="fa-solid fa-chevron-down"></i></button></div>
        <div class="p-progress"><span id="pCurrent">0:00</span><input type="range" class="p-seek" id="pSeekBar" value="0"><span id="pDuration">0:00</span></div>
        <div class="p-controls"><button class="p-btn" onclick="seek(-10)"><i class="fa-solid fa-backward"></i></button><button class="p-btn" style="font-size:2rem;color:var(--accent)" onclick="togglePlay()" id="pMainBtn"><i class="fa-solid fa-circle-play"></i></button><button class="p-btn" onclick="seek(10)"><i class="fa-solid fa-forward"></i></button></div>
    </div>
    <audio id="audio" style="display:none;"></audio>
    <script>
        const API_BASE = "/api"; const audio = document.getElementById('audio'); const pSeekBar = document.getElementById('pSeekBar');
        const searchInput = document.getElementById('searchInput'); const suggestionsBox = document.getElementById('suggestionsBox');
        let history = JSON.parse(localStorage.getItem('fHist')) || [];

        searchInput.oninput = (e) => { if(e.target.value) fetchSug(e.target.value); else showHist(); };
        searchInput.onfocus = () => { if(!searchInput.value) showHist(); };
        document.onclick = (e) => { if(!e.target.closest('.search-container')) suggestionsBox.style.display='none'; };

        function fetchSug(q) {
            const s = document.createElement('script');
            s.src = `https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(q)}&jsonp=handleSug`;
            document.head.appendChild(s);
        }
        window.handleSug = (data) => {
            const sug = data[1];
            suggestionsBox.innerHTML = sug.slice(0,6).map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-magnifying-glass"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = sug.length ? 'block' : 'none';
        };
        function showHist() {
            if(!history.length) return;
            suggestionsBox.innerHTML = history.map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue)"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = 'block';
        }
        function selSug(t) { searchInput.value=t; suggestionsBox.style.display='none'; triggerSearch(); }

        async function triggerSearch() {
            const q = searchInput.value.trim(); if(!q) return;
            history = [q, ...history.filter(i => i!==q)].slice(0,5); localStorage.setItem('fHist', JSON.stringify(history)); suggestionsBox.style.display='none';
            const resDiv = document.getElementById('results'); resDiv.innerHTML = '<p style="text-align:center; padding:30px; opacity:0.5;">Arama kriterlerine (max 5 dk) uygun şarkılar taranıyor...</p>';
            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json(); resDiv.innerHTML = "";
                data.forEach(item => {
                    resDiv.innerHTML += `<div class="card"><img src="${item.thumbnail}"><div class="info"><h3>${item.title}</h3><p><i class="fa-solid fa-clock"></i> ${item.duration}</p></div>
                        <div class="actions">
                            <button class="btn btn-play" onclick="play('${item.id}', '${item.title.replace(/'/g,"")}', '${item.thumbnail}')">Dinle</button>
                            <button class="btn btn-mp3" onclick="dl('${item.id}', 'audio')">MP3</button>
                            <button class="btn btn-mp4" onclick="dl('${item.id}', 'video')">MP4</button>
                        </div></div>`;
                });
            } catch(e) { resDiv.innerHTML = "Sonuç bulunamadı veya 5 dakikadan uzun."; }
        }

        async function play(id, title, thumb) {
            document.getElementById('playerBar').style.display = 'flex'; document.getElementById('pTitle').innerText = title; document.getElementById('pImg').src = thumb;
            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            audio.src = `${API_BASE}/stream_audio?id=${id}`; audio.play();
            document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
        }

        function togglePlay() {
            if(audio.paused) { audio.play(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; }
            else { audio.pause(); document.getElementById('pMainBtn').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; }
        }

        audio.ontimeupdate = () => { if(!isNaN(audio.duration)) { pSeekBar.max = audio.duration; pSeekBar.value = audio.currentTime; document.getElementById('pCurrent').innerText = fmt(audio.currentTime); document.getElementById('pDuration').innerText = fmt(audio.duration); } };
        pSeekBar.oninput = () => { audio.currentTime = pSeekBar.value; };
        function fmt(s) { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }
        function dl(id, type) { window.location.href = `${API_BASE}/download?id=${encodeURIComponent(id)}&type=${type}`; }
        function closePlayer() { document.getElementById('playerBar').style.display='none'; audio.pause(); }
        function seek(v) { audio.currentTime += v; }
        searchInput.onkeydown = (e) => { if(e.key==='Enter') triggerSearch(); };
    </script>
</body>
</html>
