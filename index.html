<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeDown | Müzik İndirici</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff0050; --secondary: #00f2fe; --bg: #0f0f13; --card: rgba(255, 255, 255, 0.04); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding-bottom: 50px; }
        .header { background: linear-gradient(90deg, var(--primary), var(--secondary)); padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 10px 30px rgba(255,0,80,0.2); }
        .header h1 { margin: 0; font-size: 2.5rem; font-weight: 800; letter-spacing: 1px; }
        .header p { margin: 10px 0 0; opacity: 0.9; font-size: 0.9rem; }
        .container { max-width: 700px; margin: -25px auto 0; padding: 0 20px; position: relative; z-index: 10; }
        
        .search-box { display: flex; background: #1a1a24; border-radius: 50px; padding: 5px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .search-box input { flex: 1; background: transparent; border: none; padding: 15px 25px; color: #fff; font-size: 1rem; font-family: 'Poppins', sans-serif; outline: none; }
        .search-box button { background: linear-gradient(45deg, var(--primary), #ff4a7d); border: none; width: 50px; height: 50px; border-radius: 50%; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .search-box button:active { transform: scale(0.9); }

        .loader { display: none; text-align: center; margin: 40px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .results { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; display: flex; gap: 15px; align-items: center; backdrop-filter: blur(10px); transition: 0.3s; }
        .card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .card img { width: 80px; height: 80px; border-radius: 15px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .info { flex: 1; overflow: hidden; }
        .info h3 { margin: 0 0 5px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info p { margin: 0; font-size: 12px; color: #aaa; }
        .info p i { margin-right: 5px; color: var(--secondary); }
        
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .btn { border: none; padding: 8px 12px; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; width: 90px;}
        .btn-mp3 { background: rgba(255, 0, 80, 0.2); color: #ff4a7d; border: 1px solid rgba(255, 0, 80, 0.3); }
        .btn-mp3:hover { background: #ff0050; color: white; }
        .btn-mp4 { background: rgba(0, 242, 254, 0.1); color: #00f2fe; border: 1px solid rgba(0, 242, 254, 0.3); }
        .btn-mp4:hover { background: #00f2fe; color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>VibeDown</h1>
        <p>Müzik ve Klipleri Ücretsiz Keşfet</p>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Şarkı, sanatçı veya link yaz...">
            <button onclick="searchMedia()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span style="color: #aaa; font-size: 13px;">Evrende aranıyor...</span>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        // Netlify'ın yönlendirme (proxy) sistemi sayesinde HTTP hatası almayacağız!
        const API_BASE = "/api"; 

        async function searchMedia() {
            const q = document.getElementById('searchInput').value;
            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            
            if(!q) return;
            
            resDiv.innerHTML = "";
            loader.style.display = "block";
            
            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                data.forEach(item => {
                    const sourceIcon = item.source === 'youtube' ? '<i class="fa-brands fa-youtube" style="color:#ff0000;"></i>' : '<i class="fa-brands fa-soundcloud" style="color:#ff5500;"></i>';

                    resDiv.innerHTML += `
                        <div class="card">
                            <img src="${item.thumbnail}">
                            <div class="info">
                                <h3>${item.title}</h3>
                                <p>${sourceIcon} Süre: ${item.duration}</p>
                            </div>
                            <div class="actions">
                                <button class="btn btn-mp3" onclick="downloadFile('${item.id}', '${item.source}', 'audio', this)"><i class="fa-solid fa-music"></i> MP3</button>
                                <button class="btn btn-mp4" onclick="downloadFile('${item.id}', '${item.source}', 'video', this)"><i class="fa-solid fa-video"></i> MP4</button>
                            </div>
                        </div>`;
                });
            } catch (e) { 
                resDiv.innerHTML = `<p style="text-align:center; color:#ff4a7d;"><i class="fa-solid fa-triangle-exclamation"></i> Sunucu hatası veya sonuç bulunamadı.</p>`; 
            } finally { 
                loader.style.display = "none"; 
            }
        }

        function downloadFile(id, source, type, btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Bekle...';
            window.location.href = `${API_BASE}/download?id=${encodeURIComponent(id)}&source=${source}&type=${type}`;
            setTimeout(() => { btn.innerHTML = originalText; }, 5000);
        }
    </script>
</body>
</html>
