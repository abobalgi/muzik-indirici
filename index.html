<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Music | Ultra Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.6); --border: rgba(255,255,255,0.08); --primary: #fbbf24; --accent: #f43f5e; --blue: #0ea5e9; --green: #10b981; --text: #f8fafc; --muted: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 100px; background-image: radial-gradient(circle at 50% 0%, rgba(244,63,94,0.1) 0%, rgba(9,9,11,1) 50%); background-attachment: fixed; }
        
        .header { padding: 30px 20px 10px; text-align: center; }
        .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; cursor: pointer; }
        .header h1 span { background: linear-gradient(135deg, var(--accent), #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 650px; margin: 0 auto; padding: 0 15px; }
        .search-wrapper { position: relative; z-index: 100; margin-bottom: 20px; }
        .search-box { display: flex; background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.05rem; padding-left: 15px; outline: none; }
        .search-box button { background: linear-gradient(135deg, var(--accent), #e11d48); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; }
        
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 16px; margin-top: 8px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.7); overflow: hidden; }
        .sug-item { padding: 14px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--muted); transition: 0.2s; }
        .sug-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* TABS (Trendler / Müziklerim) - ARTIK ORTALI! */
        .tabs-wrapper { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--muted); font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s; padding: 5px 10px; border-radius: 8px; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); }

        .section-content { display: none; }
        .section-content.active { display: flex; flex-direction: column; }
        
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .track-card.playing { border-color: var(--accent); background: rgba(244, 63, 94, 0.05); }
        .track-thumb { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; }
        .track-thumb:hover .play-overlay { opacity: 1; }
        .play-overlay i { color: #fff; font-size: 1.5rem; }
        
        .track-info { flex: 1; min-width: 0; padding-right: 5px; }
        .track-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; color: #fff; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; white-space: normal; }
        .track-info p { font-size: 0.8rem; color: var(--muted); }
        
        .track-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
        .btn-play-sm { background: rgba(16, 185, 129, 0.1); color: var(--green); }
        .btn-mp3 { background: rgba(244, 63, 94, 0.1); color: var(--accent); }
        .btn-mp4 { background: rgba(14, 165, 233, 0.1); color: var(--blue); }

        /* ANA PLAYER KUTUSU */
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* 1. MİNİ PLAYER (ESKİ SEVDİĞİN SÜRÜM) */
        .p-mini { background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding: 10px 20px 15px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
        .p-mini-top { display: flex; align-items: center; gap: 15px; }
        .p-mini-top img { width: 45px; height: 45px; border-radius: 8px; }
        .p-mini-meta { flex: 1; min-width: 0; }
        .p-mini-meta h4 { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;}
        .p-mini-meta p { font-size: 0.75rem; color: var(--accent); font-weight: 500; }
        .p-mini-icons { display: flex; gap: 15px; align-items: center; }
        .p-mini-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; opacity: 0.8; }
        
        .p-mini-progress { display: flex; align-items: center; gap: 10px; width: 100%; }
        .p-mini-progress span { font-size: 0.7rem; color: var(--muted); min-width: 30px; font-variant-numeric: tabular-nums;}
        .p-mini-seek { flex: 1; height: 4px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 10px; outline: none; }
        .p-mini-seek::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; background: #fff; border-radius: 50%; }
        
        .p-mini-controls { display: flex; justify-content: center; gap: 25px; align-items: center; }
        .ctrl-play-mini { font-size: 2.2rem; color: var(--accent); opacity: 1; }

        /* 2. FULL EKRAN PLAYER (MYT / SPOTIFY TARZI) */
        .p-full { display: none; height: 100vh; background: var(--bg); flex-direction: column; padding: 20px 30px; }
        .pf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; margin-top: 10px; }
        .pf-header span { font-weight: 600; color: #fff; font-size: 1.1rem; letter-spacing: 1px;}
        .pf-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        
        .pf-img-box { width: 100%; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); margin-bottom: 30px; }
        .pf-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .pf-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .pf-meta { flex: 1; overflow: hidden; text-align: left; }
        .pf-meta h2 { font-size: 1.6rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .pf-meta p { font-size: 1rem; color: var(--accent); }
        .pf-lyrics-btn { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.1rem; cursor: pointer; }
        
        .pf-progress-box { margin-bottom: 40px; }
        .pf-seek { appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; outline: none; margin-bottom: 10px; cursor: pointer; }
        .pf-seek::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
        .pf-times { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
        
        .pf-controls-row { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .pf-icon { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; opacity: 0.8; }
        .pf-icon.active { color: var(--accent); opacity: 1; }
        .pf-play { font-size: 4.5rem; color: var(--accent); opacity: 1; transition: transform 0.2s; }
        .pf-play:active { transform: scale(0.9); }

        /* STATE DEĞİŞİMİ */
        .player-bar.expanded .p-mini { display: none; }
        .player-bar.expanded .p-full { display: flex; }

        /* MODALS (EQ & Lyrics) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 3000; display: none; flex-direction: column; padding: 40px 20px; }
        .m-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .m-header h2 { font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .m-close { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.2rem; cursor: pointer; }
        .m-content { flex: 1; overflow-y: auto; text-align: center; }
        .l-text { font-size: 1.1rem; line-height: 2; color: rgba(255,255,255,0.8); white-space: pre-wrap; padding-bottom: 50px; }

        .eq-select { width: 100%; max-width: 300px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 1rem; outline: none; margin-bottom: 40px; font-family: 'Outfit'; }
        .eq-select option { background: #121216; color: #fff; }
        .eq-sliders { display: flex; justify-content: center; gap: 20px; height: 250px; }
        .eq-band { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .eq-band span { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
        .eq-slider { -webkit-appearance: slider-vertical; width: 8px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 10px; outline: none; }
        .eq-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; }

        .loader { display: none; flex-direction: column; align-items: center; padding: 40px 0; }
        .loader-ring { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(10px); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: all 0.4s; z-index: 9999; white-space: nowrap;}
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="header"><h1 onclick="window.location.href='/'">Flux<span>Music</span></h1></div>
    <div class="container">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" autocomplete="off" placeholder="Ne dinlemek istersin?">
                <button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="suggestionsBox" class="suggestions"></div>
        </div>
        
        <div class="tabs-wrapper">
            <button class="tab-btn active" id="trendTab" onclick="toggleTabs('trend')"><i class="fa-solid fa-bolt"></i> Trendler</button>
            <button class="tab-btn" id="myMusicTab" onclick="toggleTabs('myMusic')"><i class="fa-solid fa-cloud-arrow-down"></i> Müziklerim</button>
        </div>

        <div class="section-content active" id="trendContent">
            <div id="results" class="track-list"></div>
        </div>
        
        <div class="section-content" id="myMusicContent">
            <div id="myResults" class="track-list"></div>
        </div>
        
        <div class="loader" id="loader"><div class="loader-ring"></div><span style="color:var(--muted); font-size:0.9rem;">Evren taranıyor...</span></div>
    </div>

    <div class="modal" id="lyricsModal">
        <div class="m-header"><h2><i class="fa-solid fa-microphone-lines" style="color:var(--accent)"></i> Şarkı Sözleri</h2><button class="m-close" onclick="toggleModal('lyricsModal')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="m-content l-text" id="lyricsContent">Yükleniyor...</div>
    </div>

    <div class="modal" id="eqModal">
        <div class="m-header"><h2><i class="fa-solid fa-sliders" style="color:var(--blue)"></i> Ekolayzer</h2><button class="m-close" onclick="toggleModal('eqModal')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="m-content">
            <select class="eq-select" id="eqPreset" onchange="applyPreset()">
                <option value="bass" selected>Bass (Varsayılan)</option><option value="vocal">Vokal</option><option value="treble">Tiz</option><option value="electronic">Elektronik</option><option value="acoustic">Akustik</option><option value="custom" hidden>Özel Ayar</option><option value="flat">Pasif</option>
            </select>
            <div class="eq-sliders">
                <div class="eq-band"><input type="range" class="eq-slider" id="eq60" min="-12" max="12" value="6" oninput="userChangedEQ()"><span>60Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq230" min="-12" max="12" value="4" oninput="userChangedEQ()"><span>230Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq910" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>910Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq3600" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>3.6kHz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq14000" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>14kHz</span></div>
            </div>
        </div>
    </div>

    <div class="player-bar" id="playerBar">
        
        <div class="p-mini" id="pMini" onclick="togglePlayerSize()">
            <div class="p-mini-top">
                <img id="pImgMini" src="">
                <div class="p-mini-meta"><h4 id="pTitleMini">Seçilmedi</h4><p>Flux Player</p></div>
                <div class="p-mini-icons" onclick="event.stopPropagation()">
                    <button class="p-mini-btn" onclick="toggleModal('eqModal')"><i class="fa-solid fa-sliders"></i></button>
                    <button class="p-mini-btn" onclick="togglePlayerSize()"><i class="fa-solid fa-chevron-up"></i></button>
                </div>
            </div>
            <div class="p-mini-progress" onclick="event.stopPropagation()">
                <span id="pCurrentMini">0:00</span>
                <input type="range" class="p-mini-seek" id="pSeekBarMini" value="0" step="1">
                <span id="pDurationMini">0:00</span>
            </div>
            <div class="p-mini-controls" onclick="event.stopPropagation()">
                <button class="p-mini-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="p-mini-btn ctrl-play-mini" onclick="togglePlay()" id="pMainBtnMini"><i class="fa-solid fa-circle-play"></i></button>
                <button class="p-mini-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <div class="p-full" id="pFull">
            <div class="pf-header">
                <button class="pf-btn" onclick="togglePlayerSize()"><i class="fa-solid fa-chevron-down"></i></button>
                <span>Şimdi Çalıyor</span>
                <button class="pf-btn" onclick="toggleModal('eqModal')"><i class="fa-solid fa-sliders"></i></button>
            </div>
            <div class="pf-img-box"><img id="pImgFull" src=""></div>
            <div class="pf-info-row">
                <div class="pf-meta">
                    <h2 id="pTitleFull">Seçilmedi</h2>
                    <p>Flux Player</p>
                </div>
                <button class="pf-lyrics-btn" onclick="toggleModal('lyricsModal')"><i class="fa-solid fa-quote-right"></i></button>
            </div>
            <div class="pf-progress-box">
                <input type="range" class="pf-seek" id="pSeekBarFull" value="0" step="1">
                <div class="pf-times"><span id="pCurrentFull">0:00</span><span id="pDurationFull">0:00</span></div>
            </div>
            <div class="pf-controls-row">
                <button class="pf-icon" onclick="toggleShuffle()" id="shuffleBtn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="pf-icon" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="pf-icon pf-play" onclick="togglePlay()" id="pMainBtnFull"><i class="fa-solid fa-circle-play"></i></button>
                <button class="pf-icon" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                <button class="pf-icon" onclick="toggleRepeat()" id="repeatBtn"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>

    </div>

    <div id="toast" class="toast"><i class="fa-solid fa-circle-info" id="toastIcon"></i> <span id="toastMsg">İşlem yapılıyor...</span></div>
    <audio id="audio" style="display:none;" crossorigin="anonymous"></audio>

    <script>
        const API_BASE = "/api";
        const audio = document.getElementById('audio');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        
        let currentPlaylist = [], currentIndex = -1, history = JSON.parse(localStorage.getItem('fHist')) || [];
        let audioCtx, analyser, source, compressor, eqFilters = [];
        const freqs = [60, 230, 910, 3600, 14000];
        const presets = { 'bass': [6, 4, 0, 0, 0], 'vocal': [-2, 0, 3, 4, 2], 'treble': [-4, -2, 0, 4, 6], 'electronic': [5, 2, -2, 3, 4], 'acoustic': [2, 1, 2, 3, 2], 'flat': [0, 0, 0, 0, 0] };

        // 0: Kapalı, 1: Tümü, 2: Tek
        let repeatMode = 0; 
        let isShuffle = false, originalPlaylist = [];

        window.onload = () => { triggerSearch(true); };

        searchInput.oninput = (e) => { if(e.target.value) fetchSug(e.target.value); else showHist(); };
        searchInput.onfocus = () => { if(!searchInput.value) showHist(); };
        document.onclick = (e) => { if(!e.target.closest('.search-wrapper')) suggestionsBox.style.display='none'; };

        function fetchSug(q) {
            const s = document.createElement('script');
            s.src = `https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(q)}&jsonp=handleSug`;
            document.head.appendChild(s);
        }
        window.handleSug = (data) => {
            const sug = data[1];
            suggestionsBox.innerHTML = sug.slice(0,6).map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-magnifying-glass"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = sug.length ? 'block' : 'none';
        };
        function showHist() {
            if(!history.length) return;
            suggestionsBox.innerHTML = history.map(i => `<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue)"></i> ${i}</div>`).join('');
            suggestionsBox.style.display = 'block';
        }
        function selSug(t) { searchInput.value=t; suggestionsBox.style.display='none'; toggleTabs('trend'); triggerSearch(); }

        function showToast(msg, iconClass="fa-solid fa-circle-info", color="var(--primary)") {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = iconClass;
            document.getElementById('toastIcon').style.color = color;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function triggerSearch(isTrend = false) {
            const q = isTrend ? "" : searchInput.value.trim();
            if(!isTrend && !q) return;

            if(!isTrend) {
                history = [q, ...history.filter(i => i!==q)].slice(0,6);
                localStorage.setItem('fHist', JSON.stringify(history));
                suggestionsBox.style.display='none';
            }

            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            resDiv.innerHTML = ""; loader.style.display = 'flex';

            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if(data.length === 0) throw new Error("Boş Liste");
                currentPlaylist = data; originalPlaylist = [...data];
                renderPlaylist(currentPlaylist, resDiv, false);
            } catch(e) { resDiv.innerHTML = "<div style='text-align:center; color:var(--muted); padding:20px;'>Sonuç bulunamadı.</div>"; }
            finally { loader.style.display = 'none'; }
        }

        function toggleTabs(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(c => c.classList.remove('active'));
            if(tabName === 'trend') { document.getElementById('trendTab').classList.add('active'); document.getElementById('trendContent').classList.add('active'); }
            else { document.getElementById('myMusicTab').classList.add('active'); document.getElementById('myMusicContent').classList.add('active'); loadDownloads(); }
        }

        function saveDownload(id, title, thumbnail, duration) {
            let downs = JSON.parse(localStorage.getItem('fDown')) || [];
            if(!downs.find(i => i.id === id)) {
                downs = [{id, title, thumbnail, duration}, ...downs].slice(0,50);
                localStorage.setItem('fDown', JSON.stringify(downs));
                showToast("🎵 'Müziklerim' listesine eklendi!", "fa-solid fa-cloud-check", "var(--green)");
            }
        }
        function removeDownload(id, event) {
            event.stopPropagation();
            let downs = JSON.parse(localStorage.getItem('fDown')) || [];
            downs = downs.filter(i => i.id !== id);
            localStorage.setItem('fDown', JSON.stringify(downs));
            showToast("🗑️ Listeden silindi.", "fa-solid fa-trash", "var(--muted)");
            loadDownloads(); 
        }

        function loadDownloads() {
            const resDiv = document.getElementById('myResults');
            resDiv.innerHTML = "";
            let downs = JSON.parse(localStorage.getItem('fDown')) || [];
            if(!downs.length) { resDiv.innerHTML = "<div style='text-align:center; color:var(--muted); padding:20px;'>İndirilen şarkınız yok.</div>"; currentPlaylist = []; originalPlaylist = []; return; }
            currentPlaylist = downs; originalPlaylist = [...downs];
            renderPlaylist(downs, resDiv, true);
        }

        function renderPlaylist(playlist, resDiv, isMyMusic = false) {
            resDiv.innerHTML = "";
            playlist.forEach((item, index) => {
                let actionButtons = isMyMusic ? 
                    `<button class="icon-btn btn-play-sm" onclick="playSong(${index})" title="Dinle"><i class="fa-solid fa-play"></i></button>
                     <button class="icon-btn btn-mp3" onclick="removeDownload('${item.id}', event)" title="Sil"><i class="fa-solid fa-trash"></i></button>` :
                    `<button class="icon-btn btn-play-sm" onclick="playSong(${index})" title="Dinle"><i class="fa-solid fa-play"></i></button>
                     <button class="icon-btn btn-mp3" onclick="dl_safe('${item.id}', 'audio', '${item.title.replace(/'/g, "\\'")}', '${item.thumbnail}', '${item.duration}')" title="MP3"><i class="fa-solid fa-download"></i></button>
                     <button class="icon-btn btn-mp4" onclick="dl_safe('${item.id}', 'video', '${item.title.replace(/'/g, "\\'")}', '${item.thumbnail}', '${item.duration}')" title="MP4"><i class="fa-solid fa-video"></i></button>`;

                resDiv.innerHTML += `
                    <div class="track-card" id="card-${index}">
                        <div class="track-thumb" onclick="playSong(${index})"><img src="${item.thumbnail}" loading="lazy"><div class="play-overlay"><i class="fa-solid fa-play"></i></div></div>
                        <div class="track-info"><h3>${item.title}</h3><p><i class="fa-regular fa-clock"></i> ${item.duration}</p></div>
                        <div class="track-actions">${actionButtons}</div>
                    </div>`;
            });
        }

        async function playSong(index) {
            if(index < 0 || index >= currentPlaylist.length) return;
            currentIndex = index; const item = currentPlaylist[index];
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${index}`);
            if(activeCard) activeCard.classList.add('playing');
            
            document.getElementById('playerBar').style.display = 'block';
            
            // Hem Mini hem Full Player bilgilerini güncelle
            document.getElementById('pTitleMini').innerText = item.title;
            document.getElementById('pImgMini').src = item.thumbnail;
            document.getElementById('pTitleFull').innerText = item.title;
            document.getElementById('pImgFull').src = item.thumbnail;
            
            if(!audioCtx) setupAudioSystem();
            if(document.getElementById('lyricsModal').style.display === 'flex') fetchLyrics(item.title);
            
            document.getElementById('pSeekBarMini').value = 0; document.getElementById('pCurrentMini').innerText = "0:00";
            document.getElementById('pSeekBarFull').value = 0; document.getElementById('pCurrentFull').innerText = "0:00";
            
            document.getElementById('pMainBtnMini').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            document.getElementById('pMainBtnFull').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            audio.src = `${API_BASE}/stream_audio?id=${item.id}`;
            audio.play();
        }

        function togglePlayerSize() { document.getElementById('playerBar').classList.toggle('expanded'); }
        function togglePlay() { if(audio.paused) audio.play(); else audio.pause(); }
        function prevSong() { if(currentIndex > 0) playSong(currentIndex - 1); }
        function nextSong() { if(currentIndex < currentPlaylist.length - 1) playSong(currentIndex + 1); else if(repeatMode === 1) playSong(0); }
        
        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const btn = document.getElementById('repeatBtn');
            if(repeatMode === 1) { btn.innerHTML = '<i class="fa-solid fa-repeat"></i>'; btn.style.color = 'var(--accent)'; }
            else if(repeatMode === 2) { btn.innerHTML = '<i class="fa-solid fa-repeat-1"></i>'; btn.style.color = 'var(--accent)'; }
            else { btn.innerHTML = '<i class="fa-solid fa-repeat"></i>'; btn.style.color = '#fff'; }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            if(isShuffle) { btn.style.color = 'var(--accent)'; shuffleArray(currentPlaylist); }
            else { btn.style.color = '#fff'; currentPlaylist = [...originalPlaylist]; }
            if(document.getElementById('myMusicTab').classList.contains('active')) renderPlaylist(currentPlaylist, document.getElementById('myResults'), true);
        }

        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        audio.ontimeupdate = () => {
            if(!isNaN(audio.duration)) {
                const cur = audio.currentTime, dur = audio.duration;
                document.getElementById('pSeekBarMini').max = dur; document.getElementById('pSeekBarMini').value = cur;
                document.getElementById('pCurrentMini').innerText = fmt(cur); document.getElementById('pDurationMini').innerText = fmt(dur);
                document.getElementById('pSeekBarFull').max = dur; document.getElementById('pSeekBarFull').value = cur;
                document.getElementById('pCurrentFull').innerText = fmt(cur); document.getElementById('pDurationFull').innerText = fmt(dur);
            }
        };
        
        document.getElementById('pSeekBarMini').oninput = (e) => { audio.currentTime = e.target.value; };
        document.getElementById('pSeekBarFull').oninput = (e) => { audio.currentTime = e.target.value; };
        
        audio.onended = () => { if(repeatMode === 2) { audio.play(); } else { nextSong(); } };
        audio.onplay = () => { document.getElementById('pMainBtnMini').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; document.getElementById('pMainBtnFull').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; };
        audio.onpause = () => { document.getElementById('pMainBtnMini').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; document.getElementById('pMainBtnFull').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; };

        async function fetchLyrics(title) { const content = document.getElementById('lyricsContent'); content.innerHTML = "Sözler aranıyor..."; try { const res = await fetch(`${API_BASE}/lyrics?q=${encodeURIComponent(title)}`); const data = await res.json(); if(data.lyrics) content.innerText = data.lyrics; else content.innerHTML = "Sözler bulunamadı."; } catch(e) { content.innerText = "Sözlere ulaşılamadı."; } }
        function toggleModal(id) { const modal = document.getElementById(id); modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex'; if(id === 'lyricsModal' && modal.style.display === 'flex' && currentIndex >= 0) fetchLyrics(currentPlaylist[currentIndex].title); }
        function dl_safe(id, type, title, thumbs, dur) { saveDownload(id, title, thumbs, dur); dl(id, type, title); }
        function dl(id, type, title) { const typeStr = type === 'audio' ? 'MP3' : 'MP4'; showToast(`🎵 ${typeStr} hazırlanıyor...`, "fa-solid fa-spinner fa-spin", "var(--accent)"); window.location.href = `${API_BASE}/download?id=${encodeURIComponent(id)}&type=${type}`; }
        function fmt(s) { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }
        searchInput.onkeydown = (e) => { if(e.key==='Enter') { triggerSearch(); toggleTabs('trend'); } };

        function setupAudioSystem() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser(); source = audioCtx.createMediaElementSource(audio);
            compressor = audioCtx.createDynamicsCompressor(); compressor.threshold.value = -3; compressor.knee.value = 5; compressor.ratio.value = 20; compressor.attack.value = 0.005; compressor.release.value = 0.05;
            eqFilters = freqs.map(freq => { let filter = audioCtx.createBiquadFilter(); filter.type = "peaking"; filter.frequency.value = freq; filter.Q.value = 1.2; filter.gain.value = 0; return filter; });
            source.connect(eqFilters[0]); for(let i = 0; i < eqFilters.length - 1; i++) { eqFilters[i].connect(eqFilters[i+1]); }
            eqFilters[eqFilters.length - 1].connect(compressor); compressor.connect(analyser); analyser.connect(audioCtx.destination);
            applyPreset(); 
        }
        function applyPreset() { const presetName = document.getElementById('eqPreset').value; if(presetName === 'custom') return; const gains = presets[presetName]; freqs.forEach((freq, index) => { document.getElementById(`eq${freq}`).value = gains[index]; if(eqFilters[index]) eqFilters[index].gain.value = gains[index]; }); }
        function userChangedEQ() { document.getElementById('eqPreset').value = 'custom'; freqs.forEach((freq, index) => { const val = parseFloat(document.getElementById(`eq${freq}`).value); if(eqFilters[index]) eqFilters[index].gain.value = val; }); }
    </script>
</body>
</html>
