<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Music | Dinle ve İndir</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.6); --border: rgba(255,255,255,0.08); --primary: #fbbf24; --accent: #f43f5e; --blue: #0ea5e9; --green: #10b981; --text: #f8fafc; --muted: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; background-image: radial-gradient(circle at 50% 0%, rgba(244,63,94,0.1) 0%, rgba(9,9,11,1) 50%); background-attachment: fixed; }
        .header { padding: 30px 20px 10px; text-align: center; }
        .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; cursor: pointer; }
        .header h1 span { background: linear-gradient(135deg, var(--accent), #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 650px; margin: 0 auto; padding: 0 15px; }
        .search-wrapper { position: relative; z-index: 100; margin-bottom: 20px; }
        .search-box { display: flex; background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.05rem; padding-left: 15px; outline: none; }
        .search-box button { background: linear-gradient(135deg, var(--accent), #e11d48); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 16px; margin-top: 8px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.7); overflow: hidden; }
        .sug-item { padding: 14px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--muted); }
        .sug-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tabs-wrapper { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--muted); font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 5px 10px; border-radius: 8px; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); }
        .section-content { display: none; flex-direction: column; }
        .section-content.active { display: flex; }
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
        .track-card.playing { border-color: var(--accent); background: rgba(244, 63, 94, 0.05); }
        .track-thumb { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; }
        .track-thumb:hover .play-overlay { opacity: 1; }
        .play-overlay i { color: #fff; font-size: 1.5rem; }
        .track-info { flex: 1; min-width: 0; padding-right: 5px; }
        .track-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
        .track-info p { font-size: 0.8rem; color: var(--muted); }
        .track-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; transition: 0.2s;}
        .btn-play-sm { background: rgba(16, 185, 129, 0.1); color: var(--green); }
        .btn-mp3 { background: rgba(244, 63, 94, 0.1); color: var(--accent); font-weight:bold; }
        .btn-mp4 { background: rgba(14, 165, 233, 0.1); color: var(--blue); font-weight:bold; }
        .btn-mp3.working, .btn-mp4.working { animation: working 1s infinite; }
        .btn-mp3.done, .btn-mp4.done { color: var(--green); }
        @keyframes working { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; transition: transform 0.4s; display: none; }
        .p-mini { background: rgba(9, 9, 11, 0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .p-mini img { width: 45px; height: 45px; border-radius: 8px; }
        .p-mini-meta { flex: 1; min-width: 0; }
        .p-mini-meta h4 { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;}
        .p-mini-meta p { font-size: 0.75rem; color: var(--accent); }
        .p-mini-icons { display: flex; gap: 15px; align-items: center; margin-left:auto;}
        .p-mini-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; opacity: 0.8; }
        .ctrl-play-mini { font-size: 2.2rem; color: var(--accent); opacity: 1; }
        .p-full { display: none; height: 100vh; background: var(--bg); flex-direction: column; padding: 60px 30px 20px; justify-content: flex-start;}
        .pf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; margin-top: 10px; }
        .pf-header span { font-weight: 600; color: #fff; font-size: 1.1rem; }
        .pf-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .pf-img-box { width: 100%; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); margin-bottom: 25px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .pf-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .pf-info-row { display: flex; margin-bottom: 20px; }
        .pf-meta { flex: 1; overflow: hidden; text-align: left; }
        .pf-meta h2 { font-size: 1.6rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .pf-meta p { font-size: 1rem; color: var(--accent); }
        .pf-progress-box { margin-bottom: 30px; }
        .pf-seek { appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; outline: none; margin-bottom: 8px; cursor: pointer; }
        .pf-seek::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
        .pf-times { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .pf-controls-row { display: flex; justify-content: center; gap: 25px; align-items: center; width: 100%; padding: 0 10px; margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .pf-icon { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; opacity: 0.8; transition: 0.2s;}
        .pf-icon.active { color: var(--accent); opacity: 1; }
        .pf-play { font-size: 4rem; color: var(--accent); opacity: 1; }
        .pf-lyrics-row { display: flex; justify-content: flex-end; padding: 10px 0; max-width: 400px; margin-left: auto; margin-right: auto; margin-top: auto;}
        .pf-lyrics-btn { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .player-bar.expanded { transform: translateY(0); }
        .player-bar.expanded .p-mini { display: none; }
        .player-bar.expanded .p-full { display: flex; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; padding: 40px 20px; }
        .m-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .m-header h2 { font-size: 1.5rem; color: #fff; }
        .m-close { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 1.2rem; cursor: pointer; }
        .m-content { flex: 1; overflow-y: auto; text-align: center; scroll-behavior: smooth; }
        .l-lin { font-size: 1.1rem; color: rgba(255,255,255,0.4); margin-bottom: 15px; transition: 0.3s; }
        .l-act { color: #fff; font-size: 1.3rem; font-weight: 800; text-shadow: 0 0 10px var(--accent); transform: scale(1.05); }
        
        .eq-select { width: 100%; max-width: 300px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 1rem; outline: none; margin-bottom: 40px; }
        .eq-sliders { display: flex; justify-content: center; gap: 15px; height: 250px; }
        .eq-band { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .eq-band span { font-size: 0.7rem; color: var(--muted); font-weight: 700;}
        .eq-slider { -webkit-appearance: slider-vertical; width: 8px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 10px; outline: none; cursor: pointer; }
        .eq-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(244,63,94,0.5); }
        
        .loader { display: none; flex-direction: column; align-items: center; padding: 40px 0; }
        .loader-ring { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(24, 24, 27, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; opacity: 0; transition: all 0.4s; z-index: 9999; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="header"><h1 onclick="window.location.href='/'">Flux<span>Music</span></h1></div>
    <div class="container">
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" autocomplete="off" placeholder="Ne dinlemek istersin?">
                <button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="suggestionsBox" class="suggestions"></div>
        </div>
        <div class="tabs-wrapper">
            <button class="tab-btn active" id="trendTab" onclick="toggleTabs('trend')"><i class="fa-solid fa-bolt"></i> Trendler</button>
            <button class="tab-btn" id="myMusicTab" onclick="toggleTabs('myMusic')"><i class="fa-solid fa-cloud-arrow-down"></i> Müziklerim</button>
        </div>
        <div class="section-content active" id="trendContent"><div id="results" class="track-list"></div></div>
        <div class="section-content" id="myMusicContent"><div id="myResults" class="track-list"></div></div>
        <div class="loader" id="loader"><div class="loader-ring"></div><span style="color:var(--muted); font-size:0.9rem;">Evren taranıyor...</span></div>
    </div>

    <div class="modal" id="lyricsModal">
        <div class="m-header"><h2><i class="fa-solid fa-microphone-lines" style="color:var(--accent)"></i> Sözler</h2><button class="m-close" onclick="toggleModal('lyricsModal')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="m-content" id="lyricsContent">Yükleniyor...</div>
    </div>
    
    <div class="modal" id="eqModal">
        <div class="m-header"><h2><i class="fa-solid fa-sliders" style="color:var(--blue)"></i> Ekolayzer</h2><button class="m-close" onclick="toggleModal('eqModal')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="m-content">
            <select class="eq-select" id="eqPreset" onchange="applyPreset()">
                <option value="bass" selected>Bass (Derin)</option>
                <option value="vocal">Vokal (Net Ses)</option>
                <option value="treble">Tiz (Parlak)</option>
                <option value="electronic">Elektronik</option>
                <option value="acoustic">Akustik</option>
                <option value="rock">Rock (Canlı)</option>
                <option value="custom" hidden>Özel Ayar</option>
                <option value="flat">Pasif (Kapalı)</option>
            </select>
            <div class="eq-sliders">
                <div class="eq-band"><input type="range" class="eq-slider" id="eq60" min="-12" max="12" value="6" oninput="userChangedEQ()"><span>60Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq230" min="-12" max="12" value="4" oninput="userChangedEQ()"><span>230Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq910" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>910Hz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq3600" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>3.6kHz</span></div>
                <div class="eq-band"><input type="range" class="eq-slider" id="eq14000" min="-12" max="12" value="0" oninput="userChangedEQ()"><span>14kHz</span></div>
            </div>
        </div>
    </div>

    <div class="player-bar" id="playerBar">
        <div class="p-mini" id="pMini" onclick="togglePlayerSize()">
            <img id="pImgMini" src="">
            <div class="p-mini-meta"><h4 id="pTitleMini">Seçilmedi</h4><p>Flux Player</p></div>
            <div class="p-mini-icons" onclick="event.stopPropagation()">
                <button class="p-mini-btn ctrl-play-mini" onclick="togglePlay()" id="pMainBtnMini"><i class="fa-solid fa-circle-play"></i></button>
                <button class="p-mini-btn" onclick="togglePlayerSize()"><i class="fa-solid fa-chevron-up"></i></button>
            </div>
        </div>
        <div class="p-full" id="pFull">
            <div class="pf-header"><button class="pf-btn" onclick="togglePlayerSize()"><i class="fa-solid fa-chevron-down"></i></button><span>Şimdi Çalıyor</span><button class="pf-btn" onclick="toggleModal('eqModal')"><i class="fa-solid fa-sliders"></i></button></div>
            <div class="pf-img-box"><img id="pImgFull" src=""></div>
            <div class="pf-info-row">
                <div class="pf-meta"><h2 id="pTitleFull">Seçilmedi</h2><p>Flux Player</p></div>
            </div>
            <div class="pf-progress-box">
                <input type="range" class="pf-seek" id="pSeekBarFull" value="0" step="1">
                <div class="pf-times"><span id="pCurrentFull">0:00</span><span id="pDurationFull">0:00</span></div>
            </div>
            <div class="pf-controls-row">
                <button class="pf-icon" onclick="toggleShuffle()" id="shuffleBtn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="pf-icon" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="pf-icon pf-play" onclick="togglePlay()" id="pMainBtnFull"><i class="fa-solid fa-circle-play"></i></button>
                <button class="pf-icon" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                <button class="pf-icon" onclick="toggleRepeat()" id="repeatBtn"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="pf-lyrics-row"><button class="pf-lyrics-btn" onclick="toggleModal('lyricsModal')"><i class="fa-solid fa-quote-right"></i></button></div>
        </div>
    </div>
    <div id="toast" class="toast"><i class="fa-solid fa-circle-info" id="toastIcon"></i> <span id="toastMsg">İşlem...</span></div>
    <audio id="audio" style="display:none;" crossorigin="anonymous"></audio>

    <script>
        // 🛡️ ZEKİ YÜK DAĞITICI: Hata veren motoru anında atlar!
        async function fetchSmart(endpoint, opts={}) {
            let apis = [1,2].sort(() => Math.random() - 0.5);
            for(let i=0; i<apis.length; i++) { // Sadece elimizdeki motor sayısı kadar dener
                try {
                    let r = await fetch(`/api${apis[i]}${endpoint}`, opts);
                    if(r.ok) return r;
                } catch(e) { console.warn(`Motor ${apis[i]} yanıt vermedi, atlanıyor...`); }
            }
            throw new Error("Tüm motorlar meşgul veya hata verdi");
        }

        const audio=document.getElementById('audio'), pSeek=document.getElementById('pSeekBarFull');
        let currentPlaylist=[], currentIndex=-1, history=JSON.parse(localStorage.getItem('fHist'))||[], repeatMode=0, isShuffle=false, originalPlaylist=[];
        
        let audioCtx, analyser, source, compressor, eqFilters=[];
        const freqs = [60, 230, 910, 3600, 14000];
        const presets = { 'bass':[6,4,0,0,0], 'vocal':[-2,0,3,4,2], 'treble':[-4,-2,0,4,6], 'electronic':[5,2,-2,3,4], 'acoustic':[2,1,2,3,2], 'rock':[5,3,-1,3,5], 'flat':[0,0,0,0,0] };
        let pLrc=[]; 
        
        const dbReq=indexedDB.open("fDB",1); let db;
        dbReq.onupgradeneeded=e=>{ db=e.target.result; db.createObjectStore("trks",{keyPath:"id"}); };
        dbReq.onsuccess=e=>db=e.target.result;
        function saveDB(id,b){ if(db) db.transaction("trks","readwrite").objectStore("trks").put({id,blob:b}); }
        async function getDB(id){ return new Promise(r=>{ if(!db)return r(null); const rq=db.transaction("trks").objectStore("trks").get(id); rq.onsuccess=()=>r(rq.result?rq.result.blob:null); rq.onerror=()=>r(null); }); }
        function delDB(id){ if(db) db.transaction("trks","readwrite").objectStore("trks").delete(id); }

        window.onload=()=>triggerSearch(true);
        document.getElementById('searchInput').oninput=(e)=>e.target.value?fetchSug(e.target.value):showHist();
        document.getElementById('searchInput').onfocus=()=>{ if(!document.getElementById('searchInput').value) showHist(); };
        document.onclick=(e)=>{ if(!e.target.closest('.search-wrapper')) document.getElementById('suggestionsBox').style.display='none'; };

        function fetchSug(q){ const s=document.createElement('script'); s.src=`https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(q)}&jsonp=handleSug`; document.head.appendChild(s); }
        window.handleSug=(d)=>{ const b=document.getElementById('suggestionsBox'); b.innerHTML=d[1].slice(0,6).map(i=>`<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-magnifying-glass"></i> ${i}</div>`).join(''); b.style.display=d[1].length?'block':'none'; };
        function showHist(){ if(!history.length)return; const b=document.getElementById('suggestionsBox'); b.innerHTML=history.map(i=>`<div class="sug-item" onclick="selSug('${i.replace(/'/g,"")}')"><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue)"></i> ${i}</div>`).join(''); b.style.display='block'; }
        function selSug(t){ document.getElementById('searchInput').value=t; document.getElementById('suggestionsBox').style.display='none'; toggleTabs('trend'); triggerSearch(); }
        function showToast(m,ic="fa-solid fa-info",c="var(--primary)"){ const t=document.getElementById('toast'); document.getElementById('toastMsg').innerText=m; document.getElementById('toastIcon').className=ic; document.getElementById('toastIcon').style.color=c; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

        async function triggerSearch(isT=false){
            const i=document.getElementById('searchInput'), q=isT?"":i.value.trim(); if(!isT&&!q)return;
            if(!isT){ history=[q,...history.filter(x=>x!==q)].slice(0,6); localStorage.setItem('fHist',JSON.stringify(history)); document.getElementById('suggestionsBox').style.display='none'; }
            const rDiv=document.getElementById('results'), ldr=document.getElementById('loader'); rDiv.innerHTML=""; ldr.style.display='flex';
            try{ const res=await fetchSmart(`/search?q=${encodeURIComponent(q)}`); const data=await res.json(); if(!data.length)throw new Error(); currentPlaylist=data; originalPlaylist=[...data]; renderPlaylist(data,rDiv,false); }catch(e){ rDiv.innerHTML="<div style='text-align:center;padding:20px;color:var(--muted)'>Sonuç bulunamadı.</div>"; }finally{ ldr.style.display='none'; }
        }

        function toggleTabs(t){ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.section-content').forEach(c=>c.classList.remove('active')); if(t==='trend'){ document.getElementById('trendTab').classList.add('active'); document.getElementById('trendContent').classList.add('active'); }else{ document.getElementById('myMusicTab').classList.add('active'); document.getElementById('myMusicContent').classList.add('active'); loadDownloads(); } }
        function saveDownload(id,t,th,d){ let dn=JSON.parse(localStorage.getItem('fDown'))||[]; if(!dn.find(i=>i.id===id)){ dn=[{id,title:t,thumbnail:th,duration:d},...dn].slice(0,50); localStorage.setItem('fDown',JSON.stringify(dn)); } }
        function removeDownload(id,e){ e.stopPropagation(); let dn=JSON.parse(localStorage.getItem('fDown'))||[]; dn=dn.filter(i=>i.id!==id); localStorage.setItem('fDown',JSON.stringify(dn)); delDB(id); showToast("Silindi","fa-solid fa-trash","var(--muted)"); loadDownloads(); }
        
        function loadDownloads(){ const rDiv=document.getElementById('myResults'); rDiv.innerHTML=""; let dn=JSON.parse(localStorage.getItem('fDown'))||[]; if(!dn.length){ rDiv.innerHTML="<div style='text-align:center;padding:20px;color:var(--muted)'>İndirilen şarkı yok.</div>"; currentPlaylist=[]; originalPlaylist=[]; return; } currentPlaylist=dn; originalPlaylist=[...dn]; renderPlaylist(dn,rDiv,true); }
        
        function renderPlaylist(pl,rDiv,isMy){
            rDiv.innerHTML=""; pl.forEach((item,idx)=>{
                let btns=isMy ? `<button class="icon-btn btn-play-sm list-play-btn" data-song-id="${item.id}" onclick="playSong(${idx})"><i class="fa-solid fa-play"></i></button><button class="icon-btn btn-mp3" onclick="removeDownload('${item.id}',event)"><i class="fa-solid fa-trash"></i></button>` : `<button class="icon-btn btn-play-sm list-play-btn" data-song-id="${item.id}" onclick="playSong(${idx})"><i class="fa-solid fa-play"></i></button><button class="icon-btn btn-mp3" onclick="dl_smart('${item.id}','audio','${item.title.replace(/'/g,"\\'")}','${item.thumbnail}','${item.duration}',this)"><i class="fa-solid fa-download"></i></button><button class="icon-btn btn-mp4" onclick="dl_smart('${item.id}','video','${item.title.replace(/'/g,"\\'")}','${item.thumbnail}','${item.duration}',this)"><i class="fa-solid fa-video"></i></button>`;
                rDiv.innerHTML+=`<div class="track-card card-${item.id}"><div class="track-thumb" onclick="playSong(${idx})"><img src="${item.thumbnail}" loading="lazy"></div><div class="track-info"><h3>${item.title}</h3><p><i class="fa-regular fa-clock"></i> ${item.duration}</p></div><div class="track-actions">${btns}</div></div>`;
            }); updateListPlayIcons();
        }

        function updateListPlayIcons(st=''){ 
            document.querySelectorAll('.list-play-btn').forEach(b=>b.innerHTML='<i class="fa-solid fa-play"></i>'); 
            if(currentIndex>=0 && currentPlaylist[currentIndex]){ 
                const sId=currentPlaylist[currentIndex].id; 
                document.querySelectorAll(`.list-play-btn[data-song-id="${sId}"]`).forEach(aBtn=>{ 
                    aBtn.innerHTML=st==='loading'?'<i class="fa-solid fa-spinner fa-spin"></i>':(st==='playing'?'<i class="fa-solid fa-pause"></i>':'<i class="fa-solid fa-play"></i>'); 
                }); 
            } 
        }

        async function playSong(idx){
            if(idx<0||idx>=currentPlaylist.length)return; currentIndex=idx; const item=currentPlaylist[idx];
            document.querySelectorAll('.track-card').forEach(c=>c.classList.remove('playing')); 
            document.querySelectorAll(`.card-${item.id}`).forEach(c=>c.classList.add('playing'));
            
            document.getElementById('playerBar').style.display='block';
            document.getElementById('pTitleMini').innerText=item.title; document.getElementById('pImgMini').src=item.thumbnail; document.getElementById('pTitleFull').innerText=item.title; document.getElementById('pImgFull').src=item.thumbnail;
            
            if('mediaSession' in navigator){ navigator.mediaSession.metadata=new MediaMetadata({title:item.title,artist:'Flux Music',artwork:[{src:item.thumbnail,sizes:'512x512',type:'image/jpeg'}]}); navigator.mediaSession.setActionHandler('previoustrack',prevSong); navigator.mediaSession.setActionHandler('nexttrack',nextSong); navigator.mediaSession.setActionHandler('play',()=>audio.play()); navigator.mediaSession.setActionHandler('pause',()=>audio.pause()); }
            if(!audioCtx) setupAudioSystem();
            
            pSeek.value=0; document.getElementById('pCurrentFull').innerText="0:00"; pSeek.style.background=`linear-gradient(to right, var(--accent) 0%, var(--accent) 0%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.2) 100%)`;
            document.getElementById('pMainBtnMini').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>'; document.getElementById('pMainBtnFull').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
            updateListPlayIcons('loading');
            
            const lBlob = await getDB(item.id);
            if(lBlob) { audio.src = URL.createObjectURL(lBlob); } 
            else { 
                const rndApi = Math.floor(Math.random()*2)+1;
                audio.src = `/api${rndApi}/stream_audio?id=${item.id}`; 
            }
            
            audio.play().catch(()=>{ showToast("Hata!","fa-solid fa-exclamation","var(--accent)"); updateListPlayIcons('paused'); });
            fetchLyrics(item.title);
        }

        let sX=0, sY=0;
        document.getElementById('pFull').addEventListener('touchstart', e => { sX=e.touches[0].clientX; sY=e.touches[0].clientY; }, {passive:true});
        document.getElementById('pFull').addEventListener('touchend', e => {
            let dX=e.changedTouches[0].clientX-sX, dY=e.changedTouches[0].clientY-sY;
            if(Math.abs(dX) > Math.abs(dY)){ if(dX>50)prevSong(); else if(dX<-50)nextSong(); } else { if(dY>50)togglePlayerSize(); }
        });

        function togglePlayerSize(){ document.getElementById('playerBar').classList.toggle('expanded'); }
        function togglePlay(){ audio.paused?audio.play():audio.pause(); }
        function prevSong(){ if(currentIndex>0) playSong(currentIndex-1); }
        function nextSong(){ if(currentIndex<currentPlaylist.length-1) playSong(currentIndex+1); else if(repeatMode===1) playSong(0); }
        function toggleRepeat(){ repeatMode=(repeatMode+1)%3; const b=document.getElementById('repeatBtn'); if(repeatMode===1){b.innerHTML='<i class="fa-solid fa-repeat"></i>';b.style.color='var(--accent)';}else if(repeatMode===2){b.innerHTML='<i class="fa-solid fa-repeat-1"></i>';b.style.color='var(--accent)';}else{b.innerHTML='<i class="fa-solid fa-repeat"></i>';b.style.color='#fff';} }
        function toggleShuffle(){ isShuffle=!isShuffle; const b=document.getElementById('shuffleBtn'); if(isShuffle){b.style.color='var(--accent)';shuffleArray(currentPlaylist);}else{b.style.color='#fff';currentPlaylist=[...originalPlaylist];} if(document.getElementById('myMusicTab').classList.contains('active')) renderPlaylist(currentPlaylist,document.getElementById('myResults'),true); }
        function shuffleArray(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

        audio.ontimeupdate=()=>{
            if(!isNaN(audio.duration)){
                const c=audio.currentTime, d=audio.duration;
                pSeek.max=d; pSeek.value=c; document.getElementById('pCurrentFull').innerText=fmt(c); document.getElementById('pDurationFull').innerText=fmt(d);
                const pct=(c/d)*100; pSeek.style.background=`linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, rgba(255,255,255,0.2) ${pct}%, rgba(255,255,255,0.2) 100%)`;
                
                if(pLrc.length){
                    let aIdx=-1; for(let i=0;i<pLrc.length;i++){if(c>=pLrc[i].t)aIdx=i;else break;}
                    if(aIdx!==-1){
                        document.querySelectorAll('.l-lin').forEach(e=>e.classList.remove('l-act'));
                        const aEl=document.getElementById(`lr-${aIdx}`);
                        if(aEl&&!aEl.classList.contains('l-act')){ aEl.classList.add('l-act'); aEl.scrollIntoView({behavior:'smooth',block:'center'}); }
                    }
                }
            }
        };
        
        pSeek.oninput=(e)=>{ audio.currentTime=e.target.value; const d=audio.duration; if(!isNaN(d)){ const p=(e.target.value/d)*100; e.target.style.background=`linear-gradient(to right, var(--accent) 0%, var(--accent) ${p}%, rgba(255,255,255,0.2) ${p}%, rgba(255,255,255,0.2) 100%)`; } };
        audio.onended=()=>repeatMode===2?audio.play():nextSong();
        audio.onplay=()=>{ document.getElementById('pMainBtnMini').innerHTML='<i class="fa-solid fa-pause"></i>'; document.getElementById('pMainBtnFull').innerHTML='<i class="fa-solid fa-pause"></i>'; updateListPlayIcons('playing'); };
        audio.onpause=()=>{ document.getElementById('pMainBtnMini').innerHTML='<i class="fa-solid fa-play"></i>'; document.getElementById('pMainBtnFull').innerHTML='<i class="fa-solid fa-play"></i>'; updateListPlayIcons('paused'); };

        async function dl_smart(id,typ,tit,th,dur,btn){
            saveDownload(id,tit,th,dur); 
            const oH=typ==='audio'?'<i class="fa-solid fa-download"></i>':'<i class="fa-solid fa-video"></i>';
            btn.classList.add('working'); 
            btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>'; 
            showToast("Hazırlanıyor...","fa-solid fa-hourglass","var(--blue)");
            try{
                const r=await fetchSmart(`/download?id=${id}&type=${typ}`); 
                if(!r.ok)throw new Error();
                const total=parseInt(r.headers.get('content-length')||0); let loaded=0;
                const reader=r.body.getReader(); 
                const stream=new ReadableStream({
                    start(c){
                        function p(){
                            reader.read().then(({done,value})=>{
                                if(done){c.close();return;} 
                                loaded+=value.byteLength; 
                                if(total) btn.innerHTML=`<span style="font-size:0.75rem;">%${Math.round((loaded/total)*100)}</span>`; 
                                c.enqueue(value); 
                                p();
                            });
                        } 
                        p();
                    }
                });
                const b=await (new Response(stream)).blob(); 
                if(typ==='audio') saveDB(id, b); 
                const u=URL.createObjectURL(b), a=document.createElement('a'); 
                a.href=u; a.download=`${tit}.${typ==='audio'?'mp3':'mp4'}`; a.click(); URL.revokeObjectURL(u);
                
                btn.classList.remove('working'); btn.classList.add('done'); btn.innerHTML='<i class="fa-solid fa-check"></i>'; 
                showToast("Tamamlandı!","fa-solid fa-check","var(--green)"); 
                setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=oH;},3000);
            }catch(e){ 
                btn.classList.remove('working'); btn.innerHTML=oH; 
                showToast("Hata!","fa-solid fa-exclamation","var(--accent)"); 
            }
        }

        async function fetchLyrics(t){ 
            const c=document.getElementById('lyricsContent'); c.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Aranıyor...'; pLrc=[];
            try{
                const r=await fetchSmart(`/lyrics?q=${encodeURIComponent(t)}`); const d=await r.json(); 
                if(d.synced){ pLrc=d.synced.split('\n').map(l=>{const m=l.match(/\[(\d+):(\d+\.\d+)\](.*)/);return m?{t:parseInt(m[1])*60+parseFloat(m[2]),txt:m[3].trim()}:null;}).filter(i=>i&&i.txt); c.innerHTML=pLrc.map((l,i)=>`<div id="lr-${i}" class="l-lin">${l.txt}</div>`).join(''); }
                else if(d.lyrics){ c.innerHTML=`<div class="l-text">${d.lyrics}</div>`; }
                else c.innerText="Sözler bulunamadı.";
            }catch(e){c.innerText="Sözlere ulaşılamadı.";} 
        }

        function toggleModal(id){ const m=document.getElementById(id); m.style.display=m.style.display==='flex'?'none':'flex'; }
        function fmt(s){ const m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }
        document.getElementById('searchInput').onkeydown=(e)=>{ if(e.key==='Enter'){triggerSearch();toggleTabs('trend');} };

        function setupAudioSystem(){ 
            audioCtx=new(window.AudioContext||window.webkitAudioContext)(); 
            analyser=audioCtx.createAnalyser(); 
            source=audioCtx.createMediaElementSource(audio); 
            compressor=audioCtx.createDynamicsCompressor(); 
            compressor.threshold.value=-3; 
            
            eqFilters = freqs.map(f => {
                let fl = audioCtx.createBiquadFilter();
                fl.type = "peaking"; fl.frequency.value = f; fl.Q.value = 1.2; fl.gain.value = 0;
                return fl;
            });
            
            source.connect(eqFilters[0]);
            for(let i=0; i<eqFilters.length-1; i++) { eqFilters[i].connect(eqFilters[i+1]); }
            eqFilters[eqFilters.length-1].connect(compressor);
            compressor.connect(audioCtx.destination); 
            
            applyPreset(); 
        }
        
        function applyPreset(){ const p=document.getElementById('eqPreset').value; if(p==='custom')return; const g=presets[p]; freqs.forEach((f,i)=>{ if(eqFilters[i])eqFilters[i].gain.value=g[i]; }); document.querySelectorAll('.eq-slider').forEach((el, i) => { if(g[i]!==undefined) el.value = g[i]; }); }
        function userChangedEQ(){ document.getElementById('eqPreset').value='custom'; freqs.forEach((f,i)=>{ const v=parseFloat(document.getElementById(`eq${f}`).value); if(eqFilters[i])eqFilters[i].gain.value=v; }); }
    </script>
